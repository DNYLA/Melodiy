services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melodiy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-melodiydb}
    volumes:
      - ./data/dev/postgres:/var/lib/postgresql/data

  melodiy:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MELODIY_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__melodiydb: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-melodiydb};
        Username=${POSTGRES_USER:-melodiy};Password=${POSTGRES_PASSWORD}
      Authentication__Secret: ${JWT_SECRET:?set JWT_SECRET}
